name: Halogen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Patch verbatim tool to use host compiler
        run: |
          cd src
          sed -i 's|\$(CXX) \$(VERBATIM_FLAGS) tools/verbatim.cpp|g++ $(VERBATIM_FLAGS) tools/verbatim.cpp|' makefile

      - name: Build
        run: |
          cd src
          make release ARCH=neon-dotprod \
              CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
              EXTRA_CXXFLAGS="-static-libstdc++" \
              EXTRA_LDFLAGS="-static-libstdc++"

      - name: List build output
        run: |
          find bin -maxdepth 1 -type f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: halogen-android-arm64
          path: bin/Halogen-neon-dotprod

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Halogen Build ${{ github.run_number }}
          prerelease: true
          files: bin/Halogen-neon-dotprod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
