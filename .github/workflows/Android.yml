name: Build Halogen Chess Engine (Android ARM64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Build Halogen (Standard ARMv8)
        run: |
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          rm -f Halogen *.o
          make build ARCH=armv8 \
            COMP=$TOOLCHAIN/aarch64-linux-android24-clang++ \
            STRIP=$TOOLCHAIN/llvm-strip
          
          mv Halogen Halogen-armv8

      - name: Build Halogen (ARMv8.2 Dot Product)
        run: |
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          rm -f Halogen *.o
          make build ARCH=armv8-dotprod \
            COMP=$TOOLCHAIN/aarch64-linux-android29-clang++ \
            STRIP=$TOOLCHAIN/llvm-strip
          
          mv Halogen Halogen-armv8-dotprod

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: halogen-android-arm64
          path: |
            Halogen-armv8
            Halogen-armv8-dotprod
