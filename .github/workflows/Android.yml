name: Halogen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Patch verbatim tool build in Makefile
        run: |
          MAKEFILE=$(find . -maxdepth 2 -iname "makefile" | head -n 1)
          sed -i 's|\$(CXX) \$(VERBATIM_FLAGS) tools/verbatim.cpp|g++ -O3 -std=c++20 -I. tools/verbatim.cpp|' "$MAKEFILE"

      - name: Patch missing lexicographical_compare_three_way in Android libc++
        run: |
          HEADER=$(find . -name "static_vector.h")
          sed -i 's|std::lexicographical_compare_three_way|std::lexicographical_compare|g' "$HEADER"

      - name: Build
        run: |
          cd src
          make release ARCH=aarch64 \
              CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
              EXTRA_CXXFLAGS="-static-libstdc++" \
              EXTRA_LDFLAGS="-static-libstdc++"

      - name: Find binary and copy to root
        run: |
          # Finds the compiled binary and copies it to a predictable location
          BINARY=$(find . -type f -name "Halogen*" -executable | head -n 1)
          echo "Found binary at: $BINARY"
          cp "$BINARY" ./Halogen-android-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: halogen-android-arm64
          path: Halogen-android-arm64

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Halogen Build ${{ github.run_number }}
          prerelease: true
          files: Halogen-android-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
