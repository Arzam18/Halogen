name: Build Halogen for Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Locate the Makefile by its actual content rather than assuming a path. Archimedes'
      # simplified fork Makefile is unique in this repo in that it defines MODULE = Halogen —
      # the original upstream Halogen Makefile does not have that line. This avoids the
      # "No rule to make target 'build'" failure that happens when `make` picks up a
      # different Makefile than the one intended (e.g. an old copy left at repo root, or the
      # fork's Makefile actually living in a subdirectory).
      - name: Locate Archimedes Makefile
        id: locate-makefile
        run: |
          echo "All Makefiles found in repo:"
          find . -iname "Makefile"
          echo "---"
          MAKEFILE_PATH=$(grep -rl "MODULE = Halogen" --include="Makefile" . | head -n1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "ERROR: no Makefile containing 'MODULE = Halogen' was found."
            echo "The committed Makefile may still be the original upstream one, or named/placed differently than expected."
            exit 1
          fi
          echo "Using Makefile: $MAKEFILE_PATH"
          cat "$MAKEFILE_PATH"
          echo "makefile_dir=$(dirname "$MAKEFILE_PATH")" >> "$GITHUB_OUTPUT"

      # This Makefile's DFLAGS reference verbatim.nn directly (no build step generates it),
      # so confirm it's actually present before spending time on a build that will fail at
      # the #include/incbin stage with a missing-file error.
      - name: Confirm network file is present
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          ls -la verbatim.nn || echo "WARNING: verbatim.nn not found next to the Makefile — build will fail if the source expects it here"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      # Diagnostic: this Makefile calls the bare `clang++` command (COMP is forced via `override`
      # and cannot be overridden on the command line), so the correct NDK clang++ must be the one
      # PATH resolves to. Confirm the exact binary exists before relying on it.
      - name: Locate NDK generic clang++
        id: find-clang
        run: |
          TOOLCHAIN_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "toolchain_bin=$TOOLCHAIN_BIN" >> "$GITHUB_OUTPUT"
          ls "$TOOLCHAIN_BIN" | grep -E "^clang\+\+$"
          "$TOOLCHAIN_BIN/clang++" --version

      - name: Build Halogen (ARCH=armv8)
        run: |
          export PATH="${{ steps.find-clang.outputs.toolchain_bin }}:$PATH"
          # Confirm PATH resolution picked up the NDK's clang++, not a system one, before building
          which clang++
          clang++ --version
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          make build ARCH=armv8

      - name: Locate built binary
        run: |
          find "${{ steps.locate-makefile.outputs.makefile_dir }}" -maxdepth 1 -iname "Halogen*" -type f
          file "${{ steps.locate-makefile.outputs.makefile_dir }}/Halogen" || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: halogen-android-arm64
          path: ${{ steps.locate-makefile.outputs.makefile_dir }}/Halogen
          if-no-files-found: error

      - name: Create prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Halogen Android build ${{ github.run_number }}
          prerelease: true
          files: ${{ steps.locate-makefile.outputs.makefile_dir }}/Halogen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
