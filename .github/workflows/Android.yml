name: Build Halogen for Android

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # This Makefile's DFLAGS reference verbatim.nn directly (no build step generates it),
      # so confirm it's actually present before spending time on a build that will fail at
      # the #include/incbin stage with a missing-file error.
      - name: Confirm network file is present
        run: |
          find . -iname "verbatim.nn"
          ls -la verbatim.nn || echo "WARNING: verbatim.nn not found at repo root — build will fail if the source expects it here"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      # Diagnostic: this Makefile calls the bare `clang++` command (COMP is forced via `override`
      # and cannot be overridden on the command line), so the correct NDK clang++ must be the one
      # PATH resolves to. Confirm the exact binary exists before relying on it.
      - name: Locate NDK generic clang++
        id: find-clang
        run: |
          TOOLCHAIN_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "toolchain_bin=$TOOLCHAIN_BIN" >> "$GITHUB_OUTPUT"
          ls "$TOOLCHAIN_BIN" | grep -E "^clang\+\+$"
          "$TOOLCHAIN_BIN/clang++" --version

      - name: Build Halogen (ARCH=armv8)
        run: |
          export PATH="${{ steps.find-clang.outputs.toolchain_bin }}:$PATH"
          # Confirm PATH resolution picked up the NDK's clang++, not a system one, before building
          which clang++
          clang++ --version
          make build ARCH=armv8

      - name: Locate built binary
        run: |
          find . -maxdepth 2 -iname "Halogen*" -type f
          file Halogen || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: halogen-android-arm64
          path: Halogen
          if-no-files-found: error

      - name: Create prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Halogen Android build ${{ github.run_number }}
          prerelease: true
          files: Halogen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
